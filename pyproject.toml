[project]
name = "local-manga-translator"
version = "0.1.0"
description = "Fully local manga translation: MangaTranslator pipeline + llama.cpp (Gemma 4) + web UI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "manga-translator",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "onnxruntime>=1.31.1",
]

[tool.uv]
package = false

[tool.uv.sources]
manga-translator = { path = "MangaTranslator", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
