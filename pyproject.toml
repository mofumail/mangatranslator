[project]
name = "local-manga-translator"
version = "0.1.0"
description = "Fully local manga translation: detection, OCR, cleaning, LLM translation (llama.cpp), typesetting, web UI"
requires-python = ">=3.13,<3.14"
dependencies = [
    # pipeline (mangatl/, from MangaTranslator's requirements.txt; gradio UI not vendored)
    "fonttools>=4.56.0",
    "manga-ocr>=0.1.15",
    "numpy>=1.24.0",
    "opencv-contrib-python>=4.8.0",
    "pillow>=11.1.0",
    "pydantic>=2.7",
    "pyoxipng>=9.1.1",
    "pyphen>=0.18.1",
    "pythainlp>=5.3.4",
    "requests>=2.32.3",
    "safetensors>=0.4.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "skia-python>=87.7",
    "spandrel>=0.3.0",
    "transformers>=5.0.0",
    "uharfbuzz>=0.48.0",
    "ultralytics>=8.3.94",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "onnxruntime>=1.31.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["vendor", "eval/runs", "bin", "models", "translated", "webui_data"]

[tool.ruff.lint]
select = ["F", "E9", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["mangatl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Our own modules. The code derived from MangaTranslator still has ~180 basic-mode findings
# (missing stubs for skia / cv2 / harfbuzz, unchecked Optionals); see #25.
include = [
    "mangatl/settings.py", "mangatl/presets.py", "mangatl/cli.py", "translate.py", "webui.py",
    "mangatl/common/eval_hooks.py", "mangatl/ocr/line_ocr.py", "mangatl/typeset/narration.py",
    "mangatl/typeset/sfx_labels.py", "mangatl/typeset/symbols.py", "mangatl/translate/vision_pass.py",
    "mangatl/translate/page.py", "mangatl/project", "mangatl/engine",
    "mangatl/clean/page_glyph_map.py", "mangatl/ocr/readers.py",
    "mangatl/pipeline/stages.py", "mangatl/pipeline/stored.py", "eval/harness.py", "eval/rebuild_check.py", "tests",
]
typeCheckingMode = "basic"
pythonVersion = "3.13"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
